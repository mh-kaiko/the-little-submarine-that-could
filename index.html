<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kaiko: The Little Submarine That Could</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #060a18; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; font-family: 'Press Start 2P', 'Courier New', monospace; color: #e8f0ff; }
    #wrap { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; background: #0a1a4a; max-width: 100vw; max-height: 100vh; aspect-ratio: 16 / 9; width: min(100vw, calc(100vh * 16 / 9)); }
    #hint { position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; font-size: 10px; color: #7fa6d9; opacity: 0.8; pointer-events: none; }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="960" height="540"></canvas>
    <div id="hint">Move: WASD / Arrows &nbsp;·&nbsp; Shoot: Space &nbsp;·&nbsp; Special: Shift &nbsp;·&nbsp; Pause: P &nbsp;·&nbsp; Mute: M</div>
  </div>
  <script src="src/audio.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
