<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#060a18">
  <title>Kaiko: The Little Submarine That Could</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #060a18; overflow: hidden; overscroll-behavior: none; }
    body { display: flex; align-items: center; justify-content: center; font-family: 'Press Start 2P', 'Courier New', monospace; color: #e8f0ff; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #wrap { position: relative; width: 100vw; height: 100vh; height: 100dvh; display: flex; align-items: center; justify-content: center; }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; background: #0a1a4a; max-width: 100vw; max-height: 100vh; max-height: 100dvh; aspect-ratio: 16 / 9; width: min(100vw, calc(100vh * 16 / 9)); width: min(100vw, calc(100dvh * 16 / 9)); touch-action: none; }
    #hint { position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; font-size: 10px; color: #7fa6d9; opacity: 0.8; pointer-events: none; }
    #rotate { display: none; position: fixed; inset: 0; background: #060a18; color: #e8f0ff; z-index: 10; align-items: center; justify-content: center; text-align: center; font-size: 12px; line-height: 2; padding: 24px; }
    @media (pointer: coarse) { #hint { display: none; } }
    @media (pointer: coarse) and (orientation: portrait) { #rotate { display: flex; } }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="960" height="540"></canvas>
    <div id="hint">Move: WASD / Arrows &nbsp;·&nbsp; Shoot: Space &nbsp;·&nbsp; Special: Shift &nbsp;·&nbsp; Pause: P &nbsp;·&nbsp; Mute: M</div>
  </div>
  <div id="rotate">&#x1F4F1;&#x21BB;<br>Kaiko dives sideways.<br>Please rotate your phone to landscape.</div>
  <script src="src/audio.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
